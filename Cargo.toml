[workspace]
resolver = "2"
members = ["crates/shaman-core", "crates/shaman-app", "crates/shaman-helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LaRiccia"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release profile tuned for size — RAM/footprint is a stated priority.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
