<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shaman's app icon: a ringed planet, free-floating on transparency.

  No tile. Windows 11 puts its own apps in both camps, and the tile version of
  this icon read as a sticker next to the Fluent objects around it. The object
  has to carry its own contrast instead: a light blue terminator on the sphere
  and a violet ring that stays legible on a light desktop and a dark taskbar
  alike.

  Sizes 48px and below come from icon-small.svg. scripts/icons.sh renders both
  into the PNG/ICO/ICNS set.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fluent lights everything from the top left; the sphere's highlight sits
         there and the shadow runs to the opposite limb. -->
    <radialGradient id="ball" cx="0.33" cy="0.27" r="0.88">
      <stop offset="0" stop-color="#9ccdff"/>
      <stop offset="0.44" stop-color="#3b7ef0"/>
      <stop offset="1" stop-color="#12235f"/>
    </radialGradient>

    <!-- The ring travels, so its gradient is in user space rather than per
         shape: the two halves are one continuous band, not two that each
         restart at violet. -->
    <linearGradient id="ringg" gradientUnits="userSpaceOnUse" x1="140" y1="800" x2="890" y2="230">
      <stop offset="0" stop-color="#7c5cf5"/>
      <stop offset="0.5" stop-color="#c0a8ff"/>
      <stop offset="1" stop-color="#8b6bf7"/>
    </linearGradient>

    <!-- Catches the dark limb so the sphere does not dissolve into a dark
         background. -->
    <linearGradient id="rimlight" gradientUnits="userSpaceOnUse" x1="330" y1="330" x2="740" y2="740">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>

    <!-- The half of the ring that passes in front. In the ring's own rotated
         frame that is simply everything below its major axis. -->
    <mask id="front"><rect x="-560" y="0" width="1120" height="600" fill="#fff"/></mask>
  </defs>

  <!-- Scaled up from the 1024 box: the ring is tilted 38 degrees so the whole
       object is roughly square and fills the canvas the way the icons beside it
       do. A shallower tilt leaves the top and bottom of the icon empty, which
       is what makes an icon look low resolution next to its neighbours. -->
  <g transform="translate(512 512) scale(1.20) translate(-512 -512)">
    <g transform="translate(512 512) rotate(-38)">
      <ellipse cx="0" cy="0" rx="470" ry="148" fill="none" stroke="url(#ringg)" stroke-width="42"/>
    </g>
    <circle cx="512" cy="512" r="285" fill="url(#ball)"/>
    <circle cx="512" cy="512" r="285" fill="none" stroke="url(#rimlight)" stroke-width="14"/>
    <g transform="translate(512 512) rotate(-38)" mask="url(#front)">
      <ellipse cx="0" cy="0" rx="470" ry="148" fill="none" stroke="url(#ringg)" stroke-width="42"/>
    </g>
  </g>
</svg>
