<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shaman's app icon: Tide's mark (../tide) -- two notched brackets -- with its
  slash swapped for a slanted `#`, the root shell prompt. The two strokes of the
  `#` fill exactly the footprint the slash had, so the brackets are unchanged.

  It is drawn on a 32-unit grid with nothing thinner than two units, so the
  one master serves every size. scripts/icons.sh renders it into the
  PNG/ICO/ICNS set.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path fill="#cba6f7" d="M1 6h13.5l-1.75 5H6v10h3.25L7.500 26H1zM31 26H17.500l1.750-5H26V11h-3.250l1.750-5H31zM16.500 6l2.525-1.500-8.575 24.500-2.525 1.500zM21.550 3l2.525-1.500-8.575 24.500-2.525 1.500zM8 13h16v2H8zM8 17h16v2H8z"/></svg>
