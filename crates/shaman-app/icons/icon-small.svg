<?xml version="1.0" encoding="UTF-8"?>
<!--
  The icon redrawn for 48px and below (taskbar, tab strip, Alt-Tab).

  Same terminal, three changes for the downsample: the frame is thicker,
  because 48 units of border is under a pixel once the canvas is 16; the
  chevron and cursor are half again as heavy, so they stay distinguishable from
  the screen; and the title bar buttons are gone, since at this size they only
  muddy the bar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="64" y1="112" x2="960" y2="912">
      <stop offset="0" stop-color="#9ccdff"/>
      <stop offset="0.5" stop-color="#3b7ef0"/>
      <stop offset="1" stop-color="#2a3fa8"/>
    </linearGradient>
    <linearGradient id="screen" gradientUnits="userSpaceOnUse" x1="112" y1="288" x2="912" y2="864">
      <stop offset="0" stop-color="#16296e"/>
      <stop offset="1" stop-color="#0b1438"/>
    </linearGradient>
    <linearGradient id="prompt" gradientUnits="userSpaceOnUse" x1="232" y1="728" x2="400" y2="424">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#d4c4ff"/>
    </linearGradient>
  </defs>

  <rect x="64" y="112" width="896" height="800" rx="112" fill="url(#frame)"/>
  <rect x="136" y="304" width="752" height="536" rx="48" fill="url(#screen)"/>

  <polyline points="256,436 408,572 256,708" fill="none" stroke="url(#prompt)"
            stroke-width="108" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="508" y="654" width="264" height="108" rx="40" fill="#ffffff"/>
</svg>
