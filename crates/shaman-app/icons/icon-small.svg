<?xml version="1.0" encoding="UTF-8"?>
<!--
  The icon redrawn for 48px and below (taskbar, tab strip, Alt-Tab).

  Same planet, three changes for the downsample: the ring is half again as
  thick, because 42 units of stroke is under a pixel once the canvas is 16;
  the sphere is larger, so the two shapes stay distinguishable; and the rim
  light is gone, since at this size it only softens the silhouette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ball" cx="0.33" cy="0.27" r="0.88">
      <stop offset="0" stop-color="#9ccdff"/>
      <stop offset="0.44" stop-color="#3b7ef0"/>
      <stop offset="1" stop-color="#12235f"/>
    </radialGradient>
    <linearGradient id="ringg" gradientUnits="userSpaceOnUse" x1="140" y1="800" x2="890" y2="230">
      <stop offset="0" stop-color="#7c5cf5"/>
      <stop offset="0.5" stop-color="#c0a8ff"/>
      <stop offset="1" stop-color="#8b6bf7"/>
    </linearGradient>
    <mask id="front"><rect x="-560" y="0" width="1120" height="600" fill="#fff"/></mask>
  </defs>

  <g transform="translate(512 512) scale(1.14) translate(-512 -512)">
    <g transform="translate(512 512) rotate(-38)">
      <ellipse cx="0" cy="0" rx="462" ry="150" fill="none" stroke="url(#ringg)" stroke-width="66"/>
    </g>
    <circle cx="512" cy="512" r="300" fill="url(#ball)"/>
    <g transform="translate(512 512) rotate(-38)" mask="url(#front)">
      <ellipse cx="0" cy="0" rx="462" ry="150" fill="none" stroke="url(#ringg)" stroke-width="66"/>
    </g>
  </g>
</svg>
